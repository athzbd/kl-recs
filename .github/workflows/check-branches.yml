name: Check for chains

# Run by hand. Records how many outlets each entry has and which areas they
# reach, so the area filter can match any branch rather than just the pinned
# one. Pass dry_run to see the report without writing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, do not commit'
        type: boolean
        default: false
      only:
        description: 'Limit to one place id (cheap debugging — one API call)'
        type: string
        default: ''
      verbose:
        description: 'Print every search result and whether it matched'
        type: boolean
        default: false
      query:
        description: 'Run one raw search and exit (debugging, one API call)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Look for multi-outlet brands
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only=${{ inputs.only }}"
          [ "${{ inputs.verbose }}" = "true" ] && ARGS="$ARGS --verbose"
          [ -n "${{ inputs.query }}" ] && ARGS="$ARGS --query=${{ inputs.query }}"
          node scripts/check-branches.mjs $ARGS

      - name: Commit the branch data
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "kl-recs-bot"
          git config user.email "actions@github.com"
          if git diff --quiet data/places.json; then
            echo "Nothing changed."
          else
            git add data/places.json
            git commit -m "chore: record outlet counts and areas for chains"
            git push
            # A push made with GITHUB_TOKEN does not trigger other workflows,
            # so the deploy has to be asked for or the site serves stale data.
            gh workflow run deploy.yml
          fi
