name: Check for chains

# Run by hand. Reports which entries have more than one outlet so they can be
# named or split deliberately. Writes nothing.

on:
  workflow_dispatch:

jobs:
  branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Look for multi-outlet brands
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/check-branches.mjs
