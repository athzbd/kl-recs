name: Monthly place check

# Monthly rather than weekly: ~117 Place Details calls a month sits well inside
# Google's free allowance, and restaurants do not close often enough to justify
# four times the API usage.
on:
  schedule:
    - cron: '0 22 1 * *'   # 1st of the month, 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch the deploy workflow
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every place against Google
        id: check
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/check-places.mjs

      - name: Commit any changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "kl-recs-bot"
          git config user.email "actions@github.com"
          if git diff --quiet data/places.json; then
            echo "Nothing changed."
          else
            git add data/places.json
            git commit -m "chore: monthly place status refresh"
            git push
            # A push made with GITHUB_TOKEN does not trigger other workflows,
            # so the deploy has to be asked for or the site serves stale data.
            gh workflow run deploy.yml
          fi

      - name: Open an issue if anything looks closed
        if: steps.check.outputs.closed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSED: ${{ steps.check.outputs.closed_names }}
          COUNT: ${{ steps.check.outputs.closed_count }}
        run: |
          gh issue create \
            --title "$COUNT place(s) reported closed — needs a human check" \
            --body "Google reports these as permanently closed:

          $CLOSED

          They are still in the list, marked with a \"Reported closed\" badge.
          Nothing has been archived automatically, because Google sometimes
          matches the wrong venue — Fifty Tales was reported closed when the
          Petaling Jaya branch was open.

          If a place really has shut, move it to \`archive\` in data/places.json.
          If the match is wrong, set \`searchQuery\` on the entry, null its
          \`google\` block, and re-run the Resolve place IDs workflow."
