<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KL Recs</title>
  <meta name="description" content="Kuala Lumpur recommendations — food, coffee, bars, shopping, sights.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📍</text></svg>">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Applied before first paint so a dark-mode visitor never sees a white flash.
    try {
      var t = localStorage.getItem('klrecs-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="header-row">
        <h1 id="site-title">KL Recs</h1>
        <button id="theme-toggle" class="theme-toggle" type="button"
                aria-label="Switch between light and dark mode">🌙</button>
      </div>
      <p class="subtitle" id="site-subtitle"></p>
      <ul class="tips" id="tips"></ul>
    </div>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="search-row">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="search" id="search" placeholder="Search places, dishes…" autocomplete="off"
                 aria-label="Search places">
        </div>
        <div class="view-toggle" role="tablist" aria-label="View">
          <button role="tab" id="tab-list" class="active" aria-selected="true">List</button>
          <button role="tab" id="tab-map" aria-selected="false">Map</button>
        </div>
      </div>

      <div class="chip-scroller">
        <div class="chips" id="category-chips" role="group" aria-label="Filter by category"></div>
      </div>

      <div class="chip-scroller">
        <div class="filter-row">
          <div class="select-wrap">
            <select id="area-filter" aria-label="Filter by area">
              <option value="">All areas</option>
            </select>
          </div>
          <button id="near-me" class="toggle" aria-pressed="false">
            <span aria-hidden="true">📍</span> Near me
          </button>
          <button id="must-eat" class="toggle" aria-pressed="false">
            <span aria-hidden="true">⭐</span> Must eat
          </button>
        </div>
      </div>

      <div class="status-row">
        <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
        <button id="clear-filters" class="link-btn" hidden>Clear all</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <section id="list-view">
      <ul class="cards" id="cards"></ul>
      <p class="empty" id="empty" hidden>Nothing matches those filters.</p>
    </section>

    <section id="map-view" hidden>
      <div id="map"></div>
      <p class="map-fallback" id="map-fallback" hidden>
        The map needs a Google Maps API key. See the README for setup — the list
        works fine without it.
      </p>
    </section>

    <section id="archive-section" hidden>
      <details class="archive-details">
        <summary id="archive-summary">Closed / archived</summary>
        <p class="archive-note">Kept for the record.</p>
        <ul class="cards archive" id="archive-cards"></ul>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="last-updated"></p>
      <p><a href="https://github.com/athzbd/kl-recs">Source on GitHub</a></p>
    </div>
  </footer>

  <script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.umd.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
