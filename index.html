<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KL Recs</title>
  <meta name="description" content="Curated Kuala Lumpur recommendations — food, coffee, shopping, sights.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📍</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="site-title">KL Recs</h1>
      <p class="subtitle" id="site-subtitle">Places we actually recommend</p>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap">
      <div class="row row-search">
        <input type="search" id="search" placeholder="Search places, notes, tags…" autocomplete="off"
               aria-label="Search places">
        <div class="view-toggle" role="tablist" aria-label="View">
          <button role="tab" id="tab-list" class="active" aria-selected="true">List</button>
          <button role="tab" id="tab-map" aria-selected="false">Map</button>
        </div>
      </div>

      <div class="chips" id="category-chips" role="group" aria-label="Filter by category"></div>

      <div class="row row-secondary">
        <select id="area-filter" aria-label="Filter by area">
          <option value="">All areas</option>
        </select>
        <button id="near-me" class="toggle">📍 Near me</button>
        <button id="open-now" class="toggle">🕒 Open now</button>
        <button id="clear-filters" class="link-btn" hidden>Clear</button>
      </div>

      <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
    </div>
  </div>

  <main class="wrap">
    <section id="list-view">
      <ul class="cards" id="cards"></ul>
      <p class="empty" id="empty" hidden>Nothing matches those filters.</p>
    </section>

    <section id="map-view" hidden>
      <div id="map"></div>
    </section>

    <section id="archive-section" hidden>
      <h2 class="archive-heading">Closed / archived</h2>
      <p class="archive-note">These showed up as permanently closed on Google. Kept for the record.</p>
      <ul class="cards archive" id="archive-cards"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="last-updated"></p>
      <p><a href="https://github.com/athzbd/kl-recs">Source on GitHub</a></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/app.js"></script>
</body>
</html>
